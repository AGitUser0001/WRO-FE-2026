# https://github.com/cra-ros-pkg/robot_localization/blob/humble-devel/params/ekf.yaml
ekf_filter_node:
  ros__parameters:

    frequency: 20.0
    sensor_timeout: 1.0
    two_d_mode: true

    publish_tf: true
    debug: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # wheel odometry
    odom0: /wheel/odometry

    # https://docs.ros.org/en/noetic/api/robot_localization/html/index.html
    # All state estimation nodes track the 15-dimensional state of the vehicle:
    # x,y,z
    # roll,pitch,yaw
    # vx,vy,vz
    # roll,vpitch,vyaw
    # ax,ay,az
    odom0_config: [false, false, false,
                   false, false, false,
                   true, false, false,
                   false, false, true,
                   false, false, false]

    odom0_queue_size: 5
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # # IMU
    # imu0: /imu_data

    # # The TM IMU orientation/yaw can jump by ~0.7 rad on the real car.
    # # Fuse angular velocity only; wheel odom provides forward velocity.
    # imu0_config: [false, false, false,
    #               false, false, false,
    #               false, false, false,
    #               false, false, true,
    #               false, false, false]

    # imu0_queue_size: 5
    # imu0_nodelay: true
    # imu0_differential: false
    # imu0_relative: false
    # imu0_remove_gravitational_acceleration: true
